name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://blocked:blocked@127.0.0.1:1/evry_runtime_blocked
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/evry_test?schema=public
      JWT_ACCESS_SECRET: evry-test-access-secret-for-ci-2026-123456
      JWT_REFRESH_SECRET: evry-test-refresh-secret-for-ci-2026-654321
      CORS_ORIGIN: http://127.0.0.1:3000
      PORT: 4000
      SWAGGER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run openapi:check
      - run: npm run lint:check
      - run: npm run test:type-check
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:db:migrate
      - run: npm run test:integration
      - run: npm audit --audit-level=high
