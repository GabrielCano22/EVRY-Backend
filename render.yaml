services:
  - type: web
    name: evry-api-staging
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run prisma:validate && npm run prisma:generate && npm run build
    # Free web services do not support a separate pre-deploy command.
    startCommand: npm run prisma:deploy && npm run start:prod
    healthCheckPath: /api/v1/health/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: MEDIA_BASE_URL
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: SWAGGER_ENABLED
        value: "false"
